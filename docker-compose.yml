version: '3.8'

services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: streamlit run app.py

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=super_secret_key_change_in_prod
    volumes:
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
